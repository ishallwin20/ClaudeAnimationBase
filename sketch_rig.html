<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sketch rig test</title>
<!-- The Sketch style's proportion guide: the owner's rigged GLB (indian_teenager.glb, a Mixamo rig) posed by aiming its
     bones at world directions, rendered once from the shot's camera, so a figure drawn in code gets an adult's
     proportions and foreshortening. Nothing from here goes into a frame; the joints' screen positions are logged.
     node render.mjs --page=sketch_pose.html --stills=0.5 --out=out/check/pose -->
<style>html, body { margin: 0; background: #222; }</style>
</head>
<body>
<script src="src/vendor/three.min.js"></script>
<script src="src/vendor/three_fbx.min.js"></script>
<script>
// Contact sheet of the Mixamo-rigged base mesh (Man base mesh by BlakkMato, CC BY 4.0): t = file + clip fraction
const W = 1080, H = 1920, DUR = 3;
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true }); R.setClearColor(0, 0); R.setSize(W, H); document.body.appendChild(R.domElement);
const S = new THREE.Scene(), CAM = new THREE.PerspectiveCamera(24, W / H, 1, 20000);

// the OBJ sent to Mixamo had no normals: weld by position and give every vertex the smooth average of its faces
function smoothNormals(geo) {
  const p = geo.attributes.position, n = new Float32Array(p.count * 3), key = i => p.getX(i).toFixed(3) + ',' + p.getY(i).toFixed(3) + ',' + p.getZ(i).toFixed(3);
  const acc = new Map(), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), idx = geo.index;
  const tri = idx ? idx.count / 3 : p.count / 3, V = k => idx ? idx.getX(k) : k;
  for (let t = 0; t < tri; t++) { const i = V(t * 3), j = V(t * 3 + 1), k = V(t * 3 + 2);
    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, j); c.fromBufferAttribute(p, k);
    const f = new THREE.Vector3().subVectors(c, b).cross(new THREE.Vector3().subVectors(a, b));
    for (const v of [i, j, k]) { const kk = key(v); const s = acc.get(kk) || [0, 0, 0]; s[0] += f.x; s[1] += f.y; s[2] += f.z; acc.set(kk, s); } }
  for (let i = 0; i < p.count; i++) { const s = acc.get(key(i)), l = Math.hypot(...s) || 1; n[i * 3] = s[0] / l; n[i * 3 + 1] = s[1] / l; n[i * 3 + 2] = s[2] / l; }
  geo.setAttribute('normal', new THREE.BufferAttribute(n, 3));
}
const FILES = ['man_body', 'man_kneeling', 'man_standing_aim_overdraw'], M = [];
let left = FILES.length;
FILES.forEach((f, i) => {
  const x = new XMLHttpRequest(); x.open('GET', 'assets/glb/' + f + '.fbx'); x.responseType = 'arraybuffer';
  x.onload = () => { const g = new THREE.FBXLoader().parse(x.response, ''); g.traverse(n => { if (n.isMesh) { smoothNormals(n.geometry); n.material = new THREE.MeshNormalMaterial(); n.frustumCulled = false; } });
    const mix = new THREE.AnimationMixer(g), clip = g.animations[0]; if (clip) mix.clipAction(clip).play();
    M[i] = { g, mix, clip }; console.warn(f, 'clips', g.animations.map(a => a.name + ' ' + a.duration.toFixed(2)).join(','), 'meshes', (() => { let k = 0; g.traverse(n => n.isSkinnedMesh && k++); return k; })());
    if (i == 0) { const names = []; g.traverse(n => n.isBone && names.push(n.name)); const sk = []; g.traverse(n => n.isSkinnedMesh && sk.push(n)); console.warn('SK', sk.map(m => m.name + ':' + m.skeleton.bones.length).join(' '), 'shared', sk[0].skeleton.bones.filter(b => sk[1].skeleton.bones.includes(b)).length); const hips = names.filter(x => x == 'mixamorigHips'); const all = []; g.traverse(n => n.name == 'mixamorigHips' && all.push(n.type + '<' + (n.parent && n.parent.name)));  console.warn('HIPS', all.join(' | ')); } if (!--left) window.ready = true; };
  x.send();
});
const OUT = document.createElement('canvas'); OUT.width = W; OUT.height = H; document.body.appendChild(OUT);
function hex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
const P = { base: hex('#6A7698'), sh: hex('#2E3452'), hi: hex('#C4CCE2'), rf: hex('#B98A66'), line: hex('#171424'), paper: hex('#E3D4C0'), rim: [255, 250, 240] };
function mix(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
function ss(a, b, x) { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
function stylise() {
  R.render(S, CAM);
  const t = document.createElement('canvas'); t.width = W; t.height = H; const tc = t.getContext('2d'); tc.drawImage(R.domElement, 0, 0);
  const src = tc.getImageData(0, 0, W, H).data, oc = OUT.getContext('2d'), img = oc.createImageData(W, H), o = img.data;
  const N = i => [src[i] / 127.5 - 1, src[i + 1] / 127.5 - 1, src[i + 2] / 127.5 - 1];
  const L = [-.55, .62, .56], Ln = Math.hypot(...L); L[0] /= Ln; L[1] /= Ln; L[2] /= Ln;
  const R2 = [.7, -.5, .2];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4; let c = P.paper.slice();
    const a = src[i + 3] / 255;
    if (a > .02) {
      const n = N(i), d = n[0] * L[0] + n[1] * L[1] + n[2] * L[2];
      const lit = ss(.02, .1, d);                                 // near-hard terminator
      c = mix(P.sh, P.base, lit);
      c = mix(c, P.hi, ss(.62, .72, d) * .85);                    // hard-edged highlight plane
      const rf = Math.max(0, n[0] * R2[0] + n[1] * R2[1] + n[2] * R2[2]);
      c = mix(c, P.rf, (1 - lit) * ss(.25, .7, rf) * .55);        // warm bounce in the shadow
      if (lit < .5 && ((x + y) % 11) < 1.3 && rnd() > .25) c = mix(c, P.line, .55);   // hatching in shadow
      c = mix(c, P.rim, ss(.75, .9, 1 - n[2]) * ss(-.2, .3, -n[0] * .7 + n[1] * .7) * .8);   // rim on the lit edge
      // crease lines from normal discontinuities
      if (x > 1 && y > 1 && x < W - 2 && y < H - 2) {
        const r = N(i + 8), l = N(i - 8), u = N(i - W * 8), dn = N(i + W * 8);
        const g = Math.hypot(r[0] - l[0], r[1] - l[1], r[2] - l[2]) + Math.hypot(u[0] - dn[0], u[1] - dn[1], u[2] - dn[2]);
        c = mix(c, P.line, ss(.55, .9, g) * .9);
      }
      c = mix(P.paper, c, a);
    }
    // silhouette ink from the alpha edge
    if (x > 2 && y > 2 && x < W - 3 && y < H - 3) {
      const e = Math.abs(src[i + 3 + 12] - src[i + 3 - 12]) + Math.abs(src[i + 3 + W * 12] - src[i + 3 - W * 12]);
      if (e > 200) c = mix(c, P.line, Math.min(1, (e - 200) / 200));
    }
    o[i] = c[0]; o[i + 1] = c[1]; o[i + 2] = c[2]; o[i + 3] = 255;
  }
  oc.putImageData(img, 0, 0);
}

function show(i, f) {
  M.forEach((m, k) => { if (m.g.parent) S.remove(m.g); }); const m = M[i]; S.add(m.g);
  if (m.clip) m.mix.setTime(f * m.clip.duration); m.g.updateMatrixWorld(true);
  const b = new THREE.Box3(); m.g.traverse(n => { if (n.isSkinnedMesh) { n.skeleton.update(); const bb = new THREE.Box3(); const p = n.geometry.attributes.position, v = new THREE.Vector3(); for (let j = 0; j < p.count; j += 3) { n.getVertexPosition(j, v); v.applyMatrix4(n.matrixWorld); bb.expandByPoint(v); } b.union(bb); } });
  const c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3()), h = Math.max(sz.y, sz.x * H / W) * 1.15;
  const d = h / 2 / Math.tan(12 * Math.PI / 180); CAM.position.set(c.x + d * .25, c.y + h * .05, c.z + d); CAM.lookAt(c);
}
window.renderAt = async (t, type = 'image/png', q = .92) => { const i = Math.floor(t), f = t - i; show(i, f); stylise(); return OUT.toDataURL(type, q); };
window.gpuInfo = () => 'webgl';
</script>
</body>
</html>
