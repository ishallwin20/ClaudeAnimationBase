<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scribble studio</title>
<!-- The Scribble style's studio (see SCRIBBLE_GUIDE.md): Bal Hanuman breathing on his boulder in the blurred Himalaya,
     one 16 s round of box breathing. A Scribble reel copies this page to studio.html, loads src/config.js instead of
     the inline PROJECT, and swaps in its scene. render.mjs --page=scribble.html; open it with ?design to see the clean
     designs under the strokes. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: auto; max-width: min(100%, 1280px); max-height: 85vh; height: auto; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="41" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script>const PROJECT = { duration: 16, w: 1080, h: 1920, fonts: ['400 120px Kalam'] };</script>
<script src="src/cine.js"></script>
<script src="src/scribble.js"></script>
<script src="src/sc_cast.js"></script>
<script src="src/scenes/sc_demo.js"></script>
</body>
</html>
