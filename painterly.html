<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Painterly studio</title>
<!-- The Painterly style's studio (see PAINTERLY_GUIDE.md). On main it shows the cast in its forest clearing; a Painterly
     reel copies this page to studio.html, loads src/config.js instead of the inline PROJECT, and swaps in its scene.
     render.mjs --page=painterly.html; open it with ?design to see the unpainted designs. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Marcellus&family=Poppins:wght@500;600;700&family=Tiro+Devanagari+Sanskrit&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: auto; max-width: min(100%, 1280px); max-height: 85vh; height: auto; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="41" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script>const PROJECT = { duration: 6, w: 1080, h: 1920, fonts: ['28px "Tiro Devanagari Sanskrit"', '600 30px Poppins'] };</script>
<script src="src/cine.js"></script>
<script src="src/painterly.js"></script>
<script src="src/pt_cast.js"></script>
<script src="src/scenes/pt_demo.js"></script>
</body>
</html>
