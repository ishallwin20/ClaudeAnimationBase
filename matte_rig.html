<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matte rig sheet</title>
<!-- The Matte style's first test: one generated rider walking through a generated misty forest (cine.js + matte.js). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Marcellus&family=Poppins:wght@500;700&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: auto; max-width: min(100%, 1280px); max-height: 85vh; height: auto; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="8" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script>const PROJECT = { duration: 8, w: 1080, h: 1920, fonts: ['700 56px Cinzel', '42px Marcellus'] };</script>
<script src="src/cine.js"></script>
<script src="src/matte.js"></script>
<script src="src/matte_images.js"></script>
<script src="src/matte_cast.js"></script>
<script>window.DEBUG_RIG = true;</script>
<script src="src/scenes/matte_test.js"></script>
<script src="src/scenes/matte_rigsheet.js"></script>
</body>
</html>
