<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rudra Tandav · cover</title>
<!-- "Rudra Tandav" (the fierce version of "Shiv Tandav"): the Cel style (src/cel.js, src/cel_cast.js over painterly.js and cine.js): chibi Shiva dances on a
     Painterly snowfield. render.mjs drives it; open it with ?design to see the snowfield unpainted. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@500;600;700&family=Tiro+Devanagari+Sanskrit&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: auto; max-width: min(100%, 1280px); max-height: 85vh; height: auto; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="41" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<!-- The background is left as its clean design, not repainted in brush strokes: Instagram labels the Painterly brush
     texture as AI content (tested 29 Oct 2026: the painted snowfield alone was labelled; the unpainted reel was not). -->
<script>window.PT_RAW = 1;</script>
<script src="src/config.js"></script>
<script src="src/cine.js"></script>
<script src="src/painterly.js"></script>
<script src="src/cel.js"></script>
<script src="src/cel_cast.js"></script>
<script src="src/scenes/rudra_tandav.js"></script>
<script src="src/scenes/rudra_tandav_cover.js"></script>
</body>
</html>
